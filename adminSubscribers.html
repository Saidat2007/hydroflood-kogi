<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Subscribed Users</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-6">

    <div class="container mx-auto">
        <h2 class="text-2xl font-bold text-gray-800 mb-6">Subscribed Users</h2>

        <!-- Flood Alert Card Component -->
        <div class="mb-6 p-4 bg-white rounded-lg shadow-md border border-gray-200">
            <h3 class="text-lg font-semibold text-gray-700 mb-3">Send Flood Alert</h3>
            
            <div class="flex flex-col md:flex-row gap-4 items-start">
                <!-- Location Selector & Custom Input -->
                <div class="w-full md:w-1/4">
                    <label for="alertLocation" class="block text-sm font-medium text-gray-600 mb-1">Send Alert To:</label>
                    <select id="alertLocation" onchange="toggleCustomLocation(this)" class="w-full p-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 mb-2">
                        <option value="All">All Subscribers</option>
                        <option value="Lokoja">Lokoja</option>
                        <option value="Ganaja">Ganaja</option>
                        <option value="Adankolo">Adankolo</option>
                        <option value="Kabba">Kabba</option>
                        <option value="Anyigba">Anyigba</option>
                        <option value="Okene">Okene</option>
                        <option value="Idah">Idah</option>
                        <option value="Ankpa">Ankpa</option>
                        <option value="Other">Other</option>
                    </select>

                    <!-- Custom Location Input (Hidden by default) -->
                    <input type="text" id="customLocationInput" placeholder="Type custom location..." class="w-full p-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 hidden">
                </div>

                <!-- Message Box -->
                <div class="w-full md:w-2/4">
                    <label for="alertMessage" class="block text-sm font-medium text-gray-600 mb-1">Message:</label>
                    <textarea id="alertMessage" rows="2" placeholder="Type flood alert message..." class="w-full p-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
                </div>

                <!-- Submit Button -->
                <div class="w-full md:w-1/4 flex items-end">
                    <button id="sendAlertBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium p-2 rounded-md transition duration-200 mt-6 md:mt-0">
                        Send Targeted Alert
                    </button>
                </div>
            </div>
        </div>

        <!-- Subscribers Table -->
        <div class="bg-white rounded-lg shadow-md border border-gray-200 overflow-hidden">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-gray-50 border-b border-gray-200 text-gray-600 text-sm">
                        <th class="p-3">Name</th>
                        <th class="p-3">Phone</th>
                        <th class="p-3">Location</th>
                    </tr>
                </thead>
                <tbody id="subscriberTableBody" class="text-gray-700 text-sm">
                    <!-- Data will be loaded here by JavaScript -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // Fetch and load subscribers into the table
        async function loadSubscribers() {
            try {
                const response = await fetch('https://hydroflood-kogi-1.onrender.com/api/subscribers');
                const subscribers = await response.json();

                const tableBody = document.getElementById('subscriberTableBody');
                tableBody.innerHTML = ''; // Clear existing rows

                subscribers.forEach(sub => {
                    const row = `<tr class="border-b border-gray-100 hover:bg-gray-50">
                        <td class="p-3">${sub.name}</td>
                        <td class="p-3">${sub.phoneNumber}</td>
                        <td class="p-3">${sub.location}</td>
                    </tr>`;
                    tableBody.innerHTML += row;
                });
            } catch (err) {
                console.error('Error loading subscribers:', err);
            }
        }

        // Load subscribers when the page opens
        window.onload = loadSubscribers;

        // Function to show/hide the custom text box when 'Other' is selected
        function toggleCustomLocation(select) {
            const customInput = document.getElementById('customLocationInput');
            if (select.value === 'Other') {
                customInput.classList.remove('hidden');
                customInput.focus();
            } else {
                customInput.classList.add('hidden');
                customInput.value = ''; 
            }
        }

        // Button click listener for sending the targeted alert
        document.getElementById('sendAlertBtn').addEventListener('click', async () => {
            let location = document.getElementById('alertLocation').value;
            const customLocation = document.getElementById('customLocationInput').value;
            
            if (location === 'Other') {
                if (!customLocation.trim()) {
                    alert('Please type a custom location.');
                    return;
                }
                location = customLocation.trim();
            }

            const message = document.getElementById('alertMessage').value;

            if (!message.trim()) {
                alert('Please type an alert message.');
                return;
            }

            try {
                const response = await fetch('https://hydroflood-kogi-1.onrender.com/api/subscribers/send-alert', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ location, message })
                });

                const data = await response.json();
                alert(data.message);ks
            } catch (err) {
                console.error('Alert Error:', err);
                alert('Failed to send alert.');
            }
        });
    </script>
</body>
</html>
